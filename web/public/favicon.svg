<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#29B6F6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Shield body -->
  <path d="M32 3L6 14v18c0 14.4 11.1 27.8 26 30 14.9-2.2 26-15.6 26-30V14L32 3z" fill="url(#shieldGrad)"/>
  <!-- Inner shield -->
  <path d="M32 7L10 16.5v14.5c0 12.6 9.4 24.2 22 26.2 12.6-2 22-13.6 22-26.2V16.5L32 7z" fill="url(#innerGrad)" opacity="0.6"/>
  <!-- Server rack - top unit -->
  <rect x="18" y="18" width="28" height="7" rx="2" fill="#E3F2FD" opacity="0.95"/>
  <circle cx="23" cy="21.5" r="1.5" fill="#4CAF50"/>
  <rect x="27" y="20" width="8" height="3" rx="1" fill="#90CAF9" opacity="0.7"/>
  <rect x="38" y="20" width="5" height="3" rx="1" fill="#90CAF9" opacity="0.5"/>
  <!-- Server rack - middle unit -->
  <rect x="18" y="27" width="28" height="7" rx="2" fill="#E3F2FD" opacity="0.9"/>
  <circle cx="23" cy="30.5" r="1.5" fill="#4FC3F7"/>
  <rect x="27" y="29" width="8" height="3" rx="1" fill="#90CAF9" opacity="0.7"/>
  <rect x="38" y="29" width="5" height="3" rx="1" fill="#90CAF9" opacity="0.5"/>
  <!-- Server rack - bottom unit -->
  <rect x="18" y="36" width="28" height="7" rx="2" fill="#E3F2FD" opacity="0.85"/>
  <circle cx="23" cy="39.5" r="1.5" fill="#FF9800"/>
  <rect x="27" y="38" width="8" height="3" rx="1" fill="#90CAF9" opacity="0.7"/>
  <rect x="38" y="38" width="5" height="3" rx="1" fill="#90CAF9" opacity="0.5"/>
  <!-- Network lines emanating from bottom -->
  <path d="M32 46v4M26 47l-4 4M38 47l4 4" stroke="url(#accentGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <!-- Top accent - signal/antenna -->
  <path d="M32 10v5" stroke="#4FC3F7" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="32" cy="10" r="2" fill="#4FC3F7" filter="url(#glow)"/>
  <path d="M27 12a6 6 0 0 1 10 0" stroke="#4FC3F7" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M24 10a10 10 0 0 1 16 0" stroke="#4FC3F7" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.35"/>
</svg>
